[project]
name = "paypilot"
version = "0.1.0"
description = "PayPilot.AI — agentic revenue recovery for Indian subscription businesses (Razorpay Buildathon, Track 3)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "PayPilot Builder" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pydantic-settings>=2.15.0",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
paypilot-eval = "paypilot.eval.report:main"
paypilot-dashboard = "paypilot.dashboard.render:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paypilot"]

# --- Lint & format: ruff replaces black + isort + flake8 ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # warnings
    "F",     # pyflakes
    "I",     # import sorting
    "UP",    # pyupgrade — modern syntax
    "B",     # bugbear — likely bugs
    "SIM",   # simplification opportunities
    "ASYNC", # async correctness
    "S",     # bandit — security smells
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # asserts are the point in tests

# --- Types: strict from day 1 (retrofitting types hurts) ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- Tests ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/paypilot"]
branch = true

[tool.coverage.report]
show_missing = true
